<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>拾藏 · X 采集</title><link rel="stylesheet" href="panel.css"></head><body><main><small>拾藏 / COLLECTOR</small><h1>把 X 收藏带回家</h1><p>在已登录的 X 收藏页点击扩展图标，再从这里开始扫描。扫描时请保持 X 页面打开。</p><label>本地连接密钥<input id="key" type="password" placeholder="在收藏馆页面点击复制密钥"></label><button id="save">保存连接设置</button><hr><label>来源收藏夹<input id="collection" value="未分类" placeholder="可手动填写当前收藏夹名称"></label><label>最多滚动轮数<input id="rounds" type="number" min="1" max="300" value="30"></label><div><button id="scan">开始扫描</button><button id="stop" disabled>停止扫描</button><button id="preview">检查新增</button><button id="import">确认提交</button><button id="export">导出 JSON</button></div><p id="status" role="status">尚未扫描。每轮约 2 秒，内容保存在当前面板；关闭面板前请提交或导出。</p><div id="preview-list"></div></main><script src="panel.js"></script></body></html>
